{% extends "base.html" %}

{% block main %}
<h1>Our Chefs</h1>
<p>
  <a href="{% url 'menu:chef_create' %}">+ Add Chef</a>
</p>
<table border="1">
  <tr>
    <th>Name</th>
    <th>Location</th>
    <th>Actions</th>
  </tr>
  {% for chef in chefs %}
  <tr>
    <td>
      <a href="{% url 'menu:chef_detail' chef.pk %}">{{ chef }}</a>
    </td>
    <td>
      {{ chef.location }}
    </td>
    <td>
    </td>
    {% comment %}
    <a href="{% url 'menu:chef_update' chef.pk %}">Edit</a> |
    <a href="{% url 'seller-delete' seller.pk %}">Delete</a>
    {% endcomment %}
  </tr>
  {% endfor %}
</table>
{% endblock main %}
