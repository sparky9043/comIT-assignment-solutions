{% extends "base.html" %}

{% block main %}
<h1>{{ chef }}</h1>

<h2>Location</h2>
<p>{{ chef.location }}</p>
<h2>Date of Birth</h2>
<p>{{ chef.dob|date:"M. d, Y" }}</p>

<h2>Recipes Created</h2>
<ul>
  {% for item in items %}
  <li>{{ item }}</li>
  {% empty %}
  <li>No recipes created.</li>
  {% endfor %}
</ul>
<br>
{% endblock main %}
